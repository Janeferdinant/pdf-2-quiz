name: CI

on:
  push:
    branches: [main, feat/*, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test-node:
    name: Node Tests & Static Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build static export
        run: npm run build || npm run build

  test-eval:
    name: Python Evaluation Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install evaluation harness
        run: |
          uv venv
          uv pip install -e "eval/[dev]"

      - name: Run lint and type checks
        run: |
          source .venv/bin/activate
          ruff check eval
          mypy eval/src

      - name: Run evaluation tests
        run: |
          source .venv/bin/activate
          pytest eval/tests -v

      - name: Verify benchmark runner execution
        run: |
          source .venv/bin/activate
          python -m quiz_eval.runner
